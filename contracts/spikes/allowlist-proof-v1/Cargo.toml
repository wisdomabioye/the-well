[package]
name = "allowlist-proof-v1-spike"
version = "0.0.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
publish = false

[dependencies]
bitcoin = { version = "=0.32.5", default-features = false }
sha2 = "=0.10.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
alkanes-runtime = { git = "https://github.com/kungfuflex/alkanes-rs", rev = "62511e9371a3f9e448841140c51cfe428cfcb955" }

[dev-dependencies]
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
wasm-bindgen-test = "=0.3.50"
